name: 'Run SuperLinter'
description: 'Runs SuperLinter against the current repo'
runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Prepare actionlint config
      shell: bash
      run: |
        sudo mkdir -p /action/lib/.automation
        sudo cp ${{ github.action_path }}/actionlint.yaml /action/lib/.automation/actionlint.yaml
        sudo chmod 644 /action/lib/.automation/actionlint.yaml

    - name: Super-linter
      uses: super-linter/super-linter/slim@v8.7.0
      env:
        GITHUB_TOKEN: ${{ github.token }}
        LINTER_RULES_PATH: ${{ github.action_path }}
        PRETTIER_COMMAND_OPTIONS: "--config ${{ github.action_path }}/.prettierrc"
        VALIDATE_GITHUB_ACTIONS_ZIZMOR: false
        VALIDATE_BIOME_LINT: false
        VALIDATE_BIOME_FORMAT: false
