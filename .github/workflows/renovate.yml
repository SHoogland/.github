name: Renovate

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_call: 
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.2.5
        env:
          LOG_LEVEL: debug
          NODE_OPTIONS: "--max-old-space-size=4096"
