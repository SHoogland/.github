---
name: "Run Renovate"
description: "Runs Renovate against the current repo"
inputs:
  private-key:
    required: true

runs:
  using: "composite"
  steps:
    - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      id: app-token
      with:
        client-id: 2257917
        private-key: ${{ inputs.private-key }}

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        token: ${{ steps.app-token.outputs.token }}
        persist-credentials: false

    - name: Self-hosted Renovate
      uses: renovatebot/github-action@f3a31a786096ba6b40d0f0ffe11a494ef73bfa7c # v46.3.4
      env:
        RENOVATE_TOKEN: ${{ github.token }}
        RENOVATE_REPOSITORIES: ${{ github.repository }}
        NODE_OPTIONS: "--max-old-space-size=4096"
      with:
        configurationFile: ${{ github.action_path }}/renovate-global.json
        token: ${{ steps.app-token.outputs.token }}
